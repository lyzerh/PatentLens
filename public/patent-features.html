<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatentLens · Patent Features</title><link rel="stylesheet" href="/patent-features.css"><link rel="stylesheet" href="/i18n/i18n.css"><script type="module" src="/patent-features.js"></script></head>
<body><header><strong>PATENTLENS / FEATURES</strong><nav><a href="/review-thermal" data-i18n="features.back">人工标注工作台</a> · <a href="/patent-compare" data-i18n="compare.title">双专利技术特征比较</a></nav></header><main>
<h1 data-i18n="features.title">独立权利要求 1 · 技术特征解析</h1><p data-i18n="features.subtitle">免费规则候选 · 原文证据 · 人工复核，非 Gold</p>
<div class="toolbar"><label><span data-i18n="features.patent">专利</span><select id="patent"></select></label><button id="extract" type="button" data-i18n="features.extract">免费规则解析</button><button id="mock" type="button" data-i18n="features.mock">Mock 解析</button><button id="create" type="button" data-i18n="features.create">保存机器候选</button><button id="export-json" type="button" data-i18n="features.exportJson">导出 JSON</button><button id="export-md" type="button" data-i18n="features.exportMd">导出 Markdown</button></div>
<p id="message" role="status" aria-live="polite"></p><div class="workspace">
<section class="panel source"><h2 data-i18n="features.source">冻结原文</h2><div id="source-meta"></div><h3 data-i18n="features.claim">独立权利要求 1</h3><pre id="claim-text"></pre><h3 data-i18n="features.description">说明书（完整性未核定）</h3><pre id="description-text"></pre></section>
<section class="panel structure"><h2 data-i18n="features.structure">结构化候选</h2><div id="structure-content"></div><h3 data-i18n="features.editor">人工修改 · JSON 编辑器</h3><p data-i18n="features.editorHelp">修改候选后保存新修订；机器原始输出保持不变。引文必须逐字来自原文。</p><textarea id="editor" rows="18" spellcheck="false"></textarea><div class="review-bar"><label><span data-i18n="features.reviewer">审核者标识</span><input id="reviewer" maxlength="100" autocomplete="off"></label><button id="save-draft" type="button" data-i18n="features.saveDraft">保存修改草稿</button><button id="save-reviewed" type="button" data-i18n="features.saveReviewed">保存 Reviewed</button></div></section>
<section class="panel diagnostics"><h2 data-i18n="features.coverageReview">权利要求覆盖审查</h2><p data-i18n="features.coverageHelp">只读候选提示；文本覆盖不代表技术解析正确。</p><div id="coverage-review"></div><h2 data-i18n="features.diagnostics">证据与诊断</h2><div id="diagnostic-summary"></div><div id="diagnostic-list"></div><h3 data-i18n="features.history">修订历史</h3><div id="history"></div></section>
</div></main></body></html>
