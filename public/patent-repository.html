<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatentLens · Feature Repository</title><link rel="stylesheet" href="/patent-repository.css"><link rel="stylesheet" href="/i18n/i18n.css"><script type="module" src="/patent-repository.js"></script></head><body><header><strong>PATENTLENS / REPOSITORY</strong><a href="/patent-features" data-i18n="repository.back">技术特征解析</a></header><main><h1 data-i18n="repository.title">专利技术特征库</h1><p data-i18n="repository.subtitle">本地冻结数据 · 免费规则批量解析 · 结构化检索</p><p class="warning" data-i18n="repository.warning">字段匹配与精确证据不证明语义等同，也不构成法律结论。</p><p id="message" role="status" aria-live="polite"></p>
<section class="panel"><h2 data-i18n="repository.batch">批量规则解析</h2><p id="dataset"></p><label><span data-i18n="repository.method">提取方法</span><select id="extraction-method"><option value="rules" data-i18n="repository.rulesFree">Rules · 免费</option><option value="llm" data-i18n="repository.llmPaid">LLM · 可能付费</option></select></label><label class="select-all"><input type="checkbox" id="select-all"><span data-i18n="repository.selectAll">选择全部可用文献</span></label><div id="documents" class="documents"></div><div class="actions"><button id="preview" type="button" data-i18n="repository.preview">预览批量任务</button><button id="run" type="button" disabled data-i18n="repository.run">运行批量入库</button></div><p id="batch-preview" data-i18n="repository.noPreview">先选择文献并预览。运行按钮只执行本机免费规则，不下载数据。</p><h3 data-i18n="repository.summary">批次结果</h3><div id="batch-results"></div></section>
<section class="panel"><h2 data-i18n="repository.search">技术特征检索</h2><div class="filters"><label><span data-i18n="repository.text">原文/要素关键词</span><input id="query-text"></label><label><span data-i18n="repository.subject">技术对象</span><input id="query-subject"></label><label><span data-i18n="repository.element">技术要素</span><input id="query-element"></label><label><span data-i18n="repository.elementType">要素类型</span><input id="query-element-type"></label><label><span data-i18n="repository.limitationType">限定类型</span><input id="query-limitation"></label><label><span data-i18n="repository.relationType">关系类型</span><input id="query-relation"></label><label><span data-i18n="repository.method">提取方法</span><select id="query-method"><option value="">—</option><option value="rules" data-i18n="repository.rulesFree">Rules · 免费</option><option value="llm" data-i18n="repository.llmPaid">LLM · 可能付费</option></select></label><label><span data-i18n="repository.extractionStatus">提取状态</span><select id="query-extraction"><option value="">—</option><option value="extracted">extracted</option><option value="partially_extracted">partially_extracted</option></select></label><label><span data-i18n="repository.reviewStatus">复核状态</span><select id="query-review"><option value="">—</option><option value="machine_generated_unreviewed">machine_generated_unreviewed</option><option value="draft">draft</option><option value="reviewed">reviewed</option></select></label><label><span data-i18n="repository.numericMetric">数值指标</span><input id="query-metric" placeholder="particle size / melting point"></label><label><span data-i18n="repository.numericMode">数值条件</span><select id="query-mode"><option value="upper_lt">upper_lt</option><option value="overlap">overlap</option><option value="within">within</option></select></label><label><span data-i18n="repository.numericUnit">单位</span><input id="query-unit" placeholder="µm / °C"></label><label><span data-i18n="repository.numericThreshold">阈值/下限</span><input id="query-min" type="number" step="any"></label><label><span data-i18n="repository.numericMax">上限</span><input id="query-max" type="number" step="any"></label><label><span data-i18n="repository.numericBasis">百分比参照基准</span><input id="query-basis"></label></div><button id="search" type="button" data-i18n="repository.searchButton">检索</button><h3 data-i18n="repository.results">检索结果</h3><div id="results"></div><h3 data-i18n="repository.diagnostics">检索诊断</h3><div id="search-diagnostics"></div><div class="actions"><span id="compare-selection"></span><button id="compare" type="button" disabled data-i18n="repository.compare">比较 A / B</button></div><div id="evidence"></div></section>
<section class="panel"><h2 data-i18n="repository.collection">研究集合</h2><p data-i18n="repository.collectionWarning">研究集合仅组织研究资料，不代表专利族、企业持有组合或权利登记。</p><label><span data-i18n="repository.collection">研究集合</span><select id="collection-list"><option value="">—</option></select></label><div class="filters"><label><span data-i18n="repository.collectionTitle">集合名称</span><input id="collection-title" maxlength="120"></label><label><span data-i18n="repository.collectionDescription">说明</span><input id="collection-description" maxlength="2000"></label><label><span data-i18n="repository.collectionNotes">研究备注</span><textarea id="collection-notes" rows="2" maxlength="4000"></textarea></label></div><div class="actions"><button id="collection-create" type="button" data-i18n="repository.createCollection">创建集合</button><button id="collection-save" type="button" data-i18n="repository.saveCollection">保存集合信息</button><button id="collection-json" type="button" data-i18n="repository.exportJson">导出 JSON</button><button id="collection-md" type="button" data-i18n="repository.exportMd">导出 Markdown</button></div><div id="collection-detail"></div></section>
<section class="panel" id="llm-panel"><h2 data-i18n="repository.llmTitle">LLM 技术特征提取（可能付费）</h2><p data-i18n="repository.llmWarning">免费规则仍为默认流程。LLM 使用服务端 GEMINI_API_KEY，预检免费；只有再次确认费用才会发出请求。</p><p id="llm-state"></p><div class="actions"><button id="llm-preflight" type="button" disabled data-i18n="repository.llmPreflight">免费费用预检</button><button id="llm-confirm" type="button" disabled data-i18n="repository.llmConfirm">确认费用并授权</button><button id="llm-execute" type="button" disabled data-i18n="repository.llmExecute">执行已授权请求</button></div><p id="llm-quote"></p><div id="llm-results"></div></section>
</main></body></html>
