<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatentLens · Compare</title><link rel="stylesheet" href="/patent-compare.css"><link rel="stylesheet" href="/i18n/i18n.css"><script type="module" src="/patent-compare.js"></script></head><body>
<header><strong>PATENTLENS / COMPARE</strong><a href="/patent-features" data-i18n="compare.back">技术特征解析</a></header><main><h1 data-i18n="compare.title">双专利技术特征比较</h1><p data-i18n="compare.subtitle">免费规则候选 · 双方原文证据 · 人工复核</p><p class="warning" data-i18n="compare.warning">技术特征相似不代表专利法律保护范围相同。</p>
<div class="toolbar"><label><span data-i18n="compare.a">专利 A</span><select id="patent-a"></select></label><label><span data-i18n="compare.b">专利 B</span><select id="patent-b"></select></label><button id="generate" type="button" data-i18n="compare.generate">生成免费比较</button><button id="save" type="button" data-i18n="compare.save">保存机器候选</button><label><span data-i18n="compare.history">已保存的比较</span><select id="history"><option value="">—</option></select></label><button id="export-json" type="button" data-i18n="compare.exportJson">导出 JSON</button><button id="export-md" type="button" data-i18n="compare.exportMd">导出 Markdown</button></div>
<p id="message" role="status" aria-live="polite"></p><div class="sides"><section class="panel"><h2 data-i18n="compare.aFeatures">专利 A 技术特征</h2><div id="side-a"></div></section><section class="panel"><h2 data-i18n="compare.bFeatures">专利 B 技术特征</h2><div id="side-b"></div></section></div>
<section class="panel"><h2 data-i18n="compare.alignments">特征对应</h2><label><span data-i18n="compare.filter">结果筛选</span><select id="filter"><option value="all" data-i18n="compare.all">全部</option><option value="equivalent" data-i18n="compare.equivalent">相同</option><option value="similar" data-i18n="compare.similar">相似</option><option value="different" data-i18n="compare.different">不同</option><option value="evidence_missing" data-i18n="compare.evidence_missing">证据不足</option><option value="undetermined" data-i18n="compare.undetermined">待判断</option></select></label><div id="alignments"></div><h2 data-i18n="compare.ambiguous">一对多候选</h2><div id="ambiguous"></div><h2 data-i18n="compare.limitations">限定差异</h2><div id="limitations"></div><h2 data-i18n="compare.relationships">要素关系</h2><div id="relationships"></div><h2 data-i18n="compare.unmatched">未匹配要素</h2><div id="unmatched"></div></section>
<section class="panel"><h2 data-i18n="compare.evidence">原文证据</h2><div id="evidence"></div><h2 data-i18n="compare.diagnostics">验证诊断</h2><div id="diagnostics"></div></section>
<section class="panel review"><label><span data-i18n="compare.reviewer">审核者</span><input id="reviewer" maxlength="100"></label><label><span data-i18n="compare.rationale">技术差异理由</span><textarea id="rationale" rows="3"></textarea></label><button id="draft" type="button" data-i18n="compare.draft">保存审核草稿</button><button id="reviewed" type="button" data-i18n="compare.reviewed">保存 Reviewed</button><div id="revisions"></div></section>
</main></body></html>
