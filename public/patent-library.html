<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PatentLens · 专利资料库</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/i18n/i18n.css">
  <link rel="stylesheet" href="/patent-library.css">
  <script type="module" src="/patent-library.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="workspace.skip">跳到主要内容</a>
  <header></header>
  <main id="main" class="library-shell">
    <section class="library-heading" aria-labelledby="library-title">
      <div>
        <p class="library-eyebrow">PATENTLENS / LIBRARY</p>
        <h1 id="library-title" data-i18n="library.title">专利资料库</h1>
        <p data-i18n="library.subtitle">登记和管理专利文献、来源信息与内部技术资料。</p>
      </div>
      <div class="library-total"><strong id="record-total">0</strong><span data-i18n="library.total">条登记记录</span></div>
    </section>

    <p id="notice" role="status" aria-live="polite"></p>

    <section class="library-import" aria-labelledby="import-title">
      <div class="library-section-heading"><div><p class="library-eyebrow">01 / REGISTER</p><h2 id="import-title" data-i18n="library.importTitle">登记专利</h2></div><p data-i18n="library.importHelp">导入后可在下方核对来源并维护内部资料。</p></div>
      <div class="library-import-grid">
        <div class="library-import-card">
          <label for="import-file" data-i18n="library.localImport">本地 CSV / JSON 文件</label>
          <input id="import-file" type="file" accept=".csv,.json,text/csv,application/json">
          <button type="button" id="import-button" class="library-primary" data-i18n="library.importButton">导入文件</button>
          <details><summary data-i18n="library.localHelpTitle">文件应包含什么？</summary><p data-i18n="library.localHelp">公开号必填；标题、摘要、申请人、日期、分类、Claim 1 和来源链接可选。导入字段先标记为未核验。</p></details>
        </div>
        <div class="library-import-card">
          <label for="epo-id" data-i18n="library.epoImport">EPO 公开文献号</label>
          <input id="epo-id" type="text" placeholder="EP3633495A1" autocomplete="off">
          <button type="button" id="epo-import" data-i18n="library.epoButton">读取并登记 EPO 文献</button>
          <p class="library-help" data-i18n="library.epoHelp">仅保存 EPO 实际返回的字段；网络或来源不可用时会显示错误。</p>
        </div>
      </div>
    </section>

    <section id="registry" class="library-registry" aria-labelledby="registry-title">
      <div class="library-section-heading"><div><p class="library-eyebrow">02 / BROWSE</p><h2 id="registry-title" data-i18n="library.registryTitle">浏览登记记录</h2></div><span id="registry-count" class="library-count"></span></div>
      <div class="library-toolbar"><label for="registry-search" data-i18n="pilot.registrySearch">公开号快速检索</label><input id="registry-search" type="search" autocomplete="off" placeholder="EP1234567A1" data-i18n-placeholder="pilot.registrySearchPlaceholder"><span id="registry-match-count" role="status" aria-live="polite"></span></div>
      <div class="library-browser">
        <div id="registry-list" class="library-list" aria-label="Patent records"></div>
        <section id="detail" class="library-detail" aria-labelledby="detail-title"><h2 id="detail-title" data-i18n="library.detailTitle">文献详情</h2><div id="record-detail"></div></section>
      </div>
    </section>
  </main>
</body>
</html>
